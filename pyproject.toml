[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "bugscrub-local-first"
version = "0.1.0"
description = "Local-first Cisco Bug Scrub MVP scaffold."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1,<2.0",
  "openpyxl>=3.1,<4.0",
  "pandas>=2.2,<3.0",
  "Pillow>=10.4,<12.0",
  "python-dotenv>=1.0,<2.0",
  "python-pptx>=1.0,<2.0",
  "requests>=2.32,<3.0",
  "streamlit>=1.44,<2.0",
  "textual>=0.64,<1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9.0",
  "ruff>=0.11,<0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bugscrub"]
